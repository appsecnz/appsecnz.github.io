- plenary: false
  selected: true
  confirmed: true
  remote: false
  day: 0
  block: 3
  track: 0
  anchor: wilson-llm
  title: The Machines Are Learning, But Are We? 
  name: Steve Wilson
  org: Exabeam
  abstract: |-
    As technology rapidly evolves, security teams struggle to keep up. Limited visibility 
    and outdated defenses leave organizations vulnerable to attacks. This session explores 
    why visibility remains a challenge, the limitations of automation in threat detection, 
    and how AI can bridge the gap.
  bio: |-
    is the Chief AI and Product Officer at Exabeam, a global cybersecurity innovator. He founded 
    and co-chairs the OWASP Gen AI Security Project, the organization behind the industry-standard OWASP Top 10 for 
    Large Language Model Security list.
    </p>
    <p>
    His award-winning book, <em>The Developer's Playbook for Large Language Model Security</em> (O'Reilly Media), was 
    selected as Best Cutting Edge Cybersecurity Book by <em>Cyber Defense Magazine</em>.
    </p>
    <p>
    Steve contributed to the development of Java at Sun Microsystems and held leadership positions at industry 
    giants Citrix and Oracle. He holds 11 US and international patents, and was named the Cybersecurity Innovation 
    Leader by Enterprise Security Tech.

- plenary: false
  selected: true
  confirmed: true
  remote: false
  day: 0
  block: 3
  track: 1
  title: OWASP Top 10 Introduction
  name: Austin Chamberlain
  org: Defence Science and Technology, NZDF
  anchor: chamberlain-owasp
  abstract: |-
    The OWASP Top 10 is a standard awareness document for developers and web application security. 
    It represents a broad consensus about the most critical security risks to web applications.
  description: |-
    Austin will give an overview of the OWASP Top 10, including what the Top 10 represents, how 
    it is chosen, and how it is managed. The talk will include a quick technical summary of each 
    of the Top 10, how the vulnerabilities are introduced into systems, how they can be detected, 
    and how they can be prevented. This is an introductory talk and will cover ground that experienced 
    practitioners will know already, but people new to the industry will hopefully find this valuable.
  bio: |-
    is a scientist with Defence Science and Technology, part of the New Zealand 
    Defence Force. 
    </p>
    <p>
    Austin started his career as a system administrator working predominantly on web-facing systems. 
    This provided a fast understanding of information security and he focused increasingly on 
    information and cyber security, making the jump to a cyber role in due course. He served part 
    time in the British Army reserve, initially as a logistics officer, and later transferring to a 
    cyber operations role. In his civilian career he has predominantly worked in the academic sector.
    </p>
    <p>
    This combination of academic, technical, and military cyber experience provided a strong 
    foundation for a military cyber research role, and he now works on studying and integrating 
    next generation and generation-beyond-next cyber capabilities into the NZDF.

- plenary: false
  selected: true
  confirmed: true
  remote: false
  day: 0
  block: 4
  track: 0
  title: 'Security Champions: From paper to reality'
  name: Anna Lezhikova
  anchor: lezhikova-champions
  abstract: |-
    A no-BS guide to building a Security Champions programme that outlasts the hype. You'll be given the 
    fishing rod — not just the fish — with battle-tested principles and real-world tactics that actually stick.
  description: |-
    Many organisations talk about Security Champions programmes, but turning theory into a sustainable, 
    self-supporting initiative is harder than it looks. How do you get real buy-in? Where do you start? 
    How do you keep it alive beyond the initial hype? And most importantly—what actually works in the real world?
    </p>
    <p>
    In this talk, I'll cut through the fluff and share hard-won lessons. I will reveal how to win real buy-in 
    from developers, managers, and execs (spoiler: "security is important" won’t cut it), where to start 
    (and what pitfalls to avoid), and the real-world techniques that actually drove change—not just checkbox 
    exercises. No theory, just tactics that worked (and a few that crashed and burned).
    </p>
    <p>
    Key Takeaways: 
    <ul>
    <li>A blueprint for launching and scaling a Security Champions programme</li>
    <li>How to align security goals with developer incentives (hint: it's not just about compliance)</li>
    <li>Proven engagement strategies — keeping momentum when the novelty wears off</li>
    <li>Metrics that matter — measuring success beyond "number of champions"</li>
    <li>Lessons from the trenches — what NZ companies wish they knew before they started</li>
    </ul>
  bio: |-
    is a cyber security consultant based in Wellington, New Zealand. She combines her 
    experience in sociology, business management, communications, and IT to help companies to run and 
    grow their business securely in the digital age. Armed with a Master's degree in Sociology, an MBA, 
    and a Diploma in Machine Learning and Artificial Intelligence, Anna's expertise is fortified by 
    practical know-how as a full-stack and DevSecOps engineer. This unique blend equips her with the 
    capability to see problems from different perspectives and come up with holistic solutions.

- plenary: false
  selected: true
  confirmed: true
  remote: false
  day: 0
  block: 4
  track: 1
  title: Lessons from Real-World Campaigns against Web Apps
  name: Kade Morton
  org: Arachne Digital
  anchor: morton-campaigns
  description: |-
    Web applications remain one of the most common, and most attractive, targets for attackers, from 
    opportunistic script kiddies to advanced persistent threats (APTs). This talk examines real-world 
    campaigns where adversaries exploited application flaws to gain access, escalate privileges, and 
    exfiltrate data. By mapping these campaigns to the MITRE ATT&CK framework, we'll break down the 
    tactics, techniques, and procedures (TTPs) used at every stage of the attack chain.
    </p>
    <p>
    Attendees will see how these insights can inform a threat-informed defence strategy: prioritising 
    mitigations that align to real adversary behaviours, improving threat models, and enabling proactive 
    threat hunting. We'll explore case studies across different threat levels, from mass-exploitation of 
    misconfigurations to targeted attacks, drawing lessons for secure development, incident response, and 
    security architecture.
  bio: |-
    is CEO of Arachne Digital. He focuses on driving platform design and threat intelligence analysis, 
    with a passion for open-source software and public domain advocacy.

- plenary: false
  selected: true
  confirmed: true
  remote: false
  day: 0
  block: 5
  track: 0
  title: 'Good Vibes Only: A security guide to AI programming'
  name: Oliver Szimmetat
  org: TAXbit
  anchor: szimmetat-vibes
  abstract: |-
    AI programming boosts speed but creates security risks — SQL injections, weak auth, XSS vulnerabilities. 
    Learn prompt engineering techniques to get secure AI code and safely integrate it into CI/CD pipelines 
    without sacrificing development velocity.
  description: |-
    AI-assisted "vibe programming" accelerates development, but introduces critical security risks. 
    AI models prioritize working code over secure code, often generating SQL injection vulnerabilities, 
    weak authentication, and XSS attack vectors. This talk demonstrates real-world security failures in 
    AI-generated code and teaches practical prompt engineering techniques to guide models toward secure 
    patterns. Through live examples, we'll cover embedding security requirements in prompts, reviewing 
    AI code for vulnerabilities, and safely integrating AI-generated code into CI/CD pipelines while 
    maintaining development velocity.
  bio: |-
    is the Chief Privacy Office and Director of Security at TAXbit, where he manages 
    all aspects of security and compliance, including Incident Management, Corporate Security, Cloud Security, 
    Security Guidance, Product Security, Physical Security, and Compliance audits. Before joining TAXbit in 
    2023, he was Head of Cloud Security at Uber Engineering in Seattle. There, he built a team working on 
    secure-by-default architecture, best practices, engineering standards, automated compliance, monitoring tools, 
    data security, and threat detection/response solutions for all of Uber’s cloud assets and engineering efforts.
    </p>
    <p>
    Prior to that, Oliver spent more than 18 years at Microsoft, where he worked in various engineering and 
    engineering management roles contributing to Windows client security (developing, testing, and releasing 
    security updates), anti-piracy, cloud security standards, security testing, and continuous 
    integration/delivery for all the company's commercial online services.

- plenary: false
  selected: true
  confirmed: true
  remote: false
  day: 0
  block: 5
  track: 1
  title: Credential Management API
  name: Matt (TC) Cotterell
  org: CyberCX
  anchor: cotterell-api
  abstract: |-
    This talk introduces the Credential Management API, a (largely Google-driven) new standard that 
    allows the browser itself to prompt the user for login credentials, rather than having to code up 
    a web UI to do so. This is still new and largely experimental, but it is interesting to explore!
  description: |-
    The <strong>Credential Management API</strong> is an up-and-coming new browser API, a tentative 
    first step toward an interesting future where the browser handles logging in to a web application 
    instead of the web page itself! No more having to write web UI for your login pages; using this standard, 
    it could mean your browser would be able to handle it all for you! This even includes support for 
    two-factor codes (via SMS), social/federated logins and hardware tokens!
    </p>
    <p>
    We'll go through the four key areas supported by the Credential Management API (Passwords, OTP, Federated 
    Logins, and Passkeys), as well as looking at some demos of the new functionality in action. We'll also 
    explore some of the limitations of this new API at the moment.
  bio: |-
    is a Security Consultant and ex-Software Developer with over 12 years' 
    professional experience in software and security engineering many different organisations. Their 
    focus these days is exploring various authentication patterns and practices, software frameworks and 
    public cloud providers in order to craft beautiful, secure and maintainable solutions to challenging 
    technical problems.
    </p>
    <p>
    They are currently working for CyberCX as a Senior Security Consultant, testing web applications, 
    APIs and cloud configurations for security vulnerabilities. They are also starting to host the 
    <a href="https://www.meetup.com/owasp-wellington" target="_blank"><strong>OWASP Wellington</strong> Meetups</a> 
    on a more frequent basis.

- plenary: false
  selected: true
  confirmed: true
  remote: false
  day: 0
  block: 7
  track: 0
  title: "Baking Security In: An AppSec 'critical path' for developers"
  name: John DiLeo
  org: Gallagher Security / OWASP NZ
  anchor: dileo-baking
  twitter: gr4ybeard
  linkedin: john-dileo
  description: |-
    "We're Agile, so there's no time for that!" -- This response, or something similar, is what I frequently 
    hear after telling a development team they should include threat modelling, security testing, or other 
    application security (AppSec) activities in their workflows. AppSec activities are frequently seen as 
    heavyweight tasks that will interfere with delivery, instead of the quality and efficiency multipliers 
    they can actually be.
    </p>
    <p>
    In this talk, I'll present my thoughts on key Software Assurance activities teams can introduce into 
    their day-to-day development practices - activities that align amazingly well with the recommended 
    Security Practices in the 
    <a href="https://owaspsamm.org" target="_blank">OWASP Software Assurance Maturity Model (SAMM)</a>. 
    I'll also touch on how they can be incorporated into a team's existing development cadence with 
    (relatively) little disruption.
  bio: |-
    leads the OWASP New Zealand Chapter. In his day job, John is the Application Security Lead at Gallagher 
    Security in Hamilton. Before joining Gallagher, John led the Application Security Services team at Datacom, 
    providing support and guidance to clients in launching, managing, and maturing their enterprise software 
    assurance programs.
    </p>
    <p>
    Before turning to full-time roles in security, John was active as a Java enterprise architect and Web 
    application developer. In earlier lives, John has been a full-time professor and had specialized in 
    developing discrete-event simulations of large distributed systems.

- plenary: false
  selected: true
  confirmed: true
  remote: true
  day: 0
  block: 7
  track: 1
  title: "Security and Accessibility Can Be Friends!"
  name: Gian Wild
  org: AccessibilityOz
  anchor: wild-friends
  abstract: |-
    Many a security expert has been told that security may be compromised due to accessibility needs. 
    Many an accessibility expert has been told accessibility must be reduced to allow for security. 
    Gian Wild is here to tell you that they are wrong.
  description: |-
   Many a security expert has been told that security may be compromised due to accessibility needs. 
   Many an accessibility expert has been told accessibility must be reduced to allow for security. 
   Gian Wild is here to tell you that they are wrong. People often think these two very important 
   disciplines are mutually-exclusive but this is only because they don’t understand both sets of requirements. 
   From the not-so-humble CAPTCHA to the auto completion of forms, Gian talks about what the accessibility 
   needs are and how security need never be compromised, and most importantly, how you can understand 
   both sides of the divide.
  bio: |-
    works in the area of web accessibility: making sure websites and mobile apps can be used by people 
    with disabilities. She spent six years contributing to the international set of web accessibility guidelines 
    used around the world. Gian spends half the year in Australia and half the year in the United States. She 
    speaks at conferences in Australia, the US, Canada, South America and Europe. In June 2015, Gian presented 
    to the United Nations on the importance of web accessibility at the Conference of State Parties to the 
    Convention on the Rights of Persons with Disabilities. She is the CEO and Founder of AccessibilityOz, 
    with offices in Australia and the United States. In 2019, Gian won the inaugural Accessibility 
    Person of the Year in Australia.

- plenary: false
  selected: true
  confirmed: true
  remote: false
  day: 0
  block: 8
  track: 0
  title: 'How to Secure a Cup of Black Gold (coffee, not oil)'
  name: David (Moss) Jennings
  org: Fluid Security
  anchor: jennings-coffee
  abstract: |-
    Let me take you on a journey to explain, in simple terms, the concept of adding multiple security controls 
    to secure a system with data residing on-prem or in the cloud, by using the analogy of a cup with coffee 
    in it. After all, who doesn't want to protect their coffee?
  description: |-
    "You like coffee, right? Well, have you ever thought about how you would secure your cup of coffee against 
    a would-be adversary?" This was the moment when the conversation I was having with a business person took a turn. 
    Their initial expression of "who is this madman?" soon changed - the more they role-played, the more they understood.
    </p>
    <p>
    Incorporating a defence-in-depth strategy can be hard to understand for non-security folk. However, when you 
    use analogies of everyday important things like coffee, it's amazing how quickly people can understand what 
    adding multiple layers of security controls means and how they can apply it to suit their context to a 'tea.'
    </p>
    <p>
    Optional: bring a cup of your own beverage to follow along.
  bio: |-
    remains optimistic that he can make organisations great again (read: more secure). However, he has seen his 
    fair share of horror stories over his career. With risks being blindly accepted and added to ever expanding 
    registers, it wasn’t long before he was in the ambulance at the bottom of the cliff. Let his dulcet tones 
    soothe you as you come for a ride and learn how to be useful instead of just making nee-naw sounds when the 
    worst occurs.

- plenary: false
  selected: true
  confirmed: true
  remote: false
  day: 0
  block: 8
  track: 1
  title: Making Security a Business Priority with Rapid Threat Modelling
  name: Michael Matthee
  anchor: matthee-modelling
  org: Cyber CX
  linkedin: michaelhmatthee
  description: |-
    Ten years ago, my threat modelling was...messy — fruitless exercises from the tech dungeon, jargon-filled 
    diagrams no one understood, and those dreaded 50-page risk reports doomed to collect dust (never again!). 
    Threat modelling doesn't have to be slow, painful, or disconnected from the business. This talk shows how 
    I ran rapid 30-minute sessions tied directly to business goals like revenue, strategy, and growth.
    </p>
    <p>
    This is a messy story of how I figured out how to:
    <ul>
    <li>Facilitate threat models to different audiences — business execs for strategy and engineers for tech — 
    and get the tech to speak business;</li>
    <li>Add structure and time-box threat modeling for maximum impact; and</li>
    <li>Tier systems and prioritize what truly matters, fast.</li>
    </ul>
  bio: |-
    - "Learn, grow, then apply to win" — This principle has guided my 18-year cybersecurity journey. I began in 
    software engineering, designing enterprise systems for global organizations, but my true passion emerged when 
    I started teaching cybersecurity — simplifying complex security concepts for engineers, executives, and 
    future security leaders.
    </p>
    <p>
    With hands-on experience securing financial systems, SaaS platforms, and critical infrastructure, I've built 
    security-first cultures, transformed security postures, and automated security at scale.
    </p>
    <p>
    From securing Canada's oldest bank to co-designing the security architecture for a $60M blockchain initiative, 
    I focus on solutions that reduce risk while enabling business growth. I've led penetration testing for a 
    $140M-funded startup, optimized WAF security to block 60% of attacks, and achieved 99% MFA adoption in one month.

- plenary: false
  selected: true
  confirmed: true
  remote: false
  day: 0
  block: 10
  track: 0
  title: Supply Chain Vulnerabilities in the Supply Chain Vulnerability Ecosystem
  name: Kris Hardy
  org: VioletBeacon
  anchor: hardy-ecosystem
  abstract: |-
    In March 2025, the Common Vulnerabilities and Exposures (CVE) project was nearly defunded by the US 
    Government, causing panic in the security industry. We will discuss the CVE project, how it fits into 
    the security ecosystem, and what is being done to build alternatives.
  description: |-
    In March 2025, the MITRE Corporation-managed Common Vulnerabilities and Exposures (CVE) project was nearly 
    defunded by the US Government, causing widespread concern across the security industry. They were literally 
    saved in the last hours by a short-term 11-month contract, and surprisingly, this was not the first time. 
    However, with the US Government's current slash-and-burn approach to government programs, the survival of 
    the CVE project is not guaranteed when their current funding runs out.
    </p>
    <p>
    Why did this cause so much concern? When software is built, it nearly always includes a large number of 
    third-party and open source components that provide some functionality so that the developers of the software 
    can focus on the core problems that they need to solve. Unfortunately, these components may have vulnerabilities 
    that make your software vulnerable to attack, have licenses which create legal risks for your organisation, rely 
    on external services that are unexpected or undesired, or be of questionable provenance. To solve this, many 
    organisations now use a Software Bill of Materials (SBOM) and Source Composition Analysis (SCA) (such as OWASP 
    dependency-check) as part of their Cyber Supply Chain Risk Management (C-SCRM) process.
    </p>
    <p>
    The CVE project provides one of the core datasets that is used to check for known vulnerabilities in the software 
    BOM and is consumed by SCA systems. Even if it is not being used directly, it is used by downstream vendors such 
    as the US National Institute of Standards and Technology (NIST) National Vulnerability Database (NVD) and commercial 
    SCA systems. Because it is such a core technology, many fear that the software supply chain vulnerability ecosystem 
    would collapse if the CVE project goes dark.
    </p>
    <p>
    But the CVE project is not without its weaknesses and controversies, some of which are due to the design of the 
    CVE project and others are due to questionable actions by some contributors. To explain the software supply chain 
    ecosystem, the role of the CVE project, downstream consumers of the CVE dataset, and ultimately the potential impact 
    on an organisation, this talk will take a real-world vulnerability and follow it through the vulnerability resolution 
    process from start to finish in order to explain the full ecosystem and what would happen if one part of that 
    ecosystem fails: from discovery and notifying the vendor, to getting it into the CVE catalog and consumed by downstream 
    vendors, to its inclusion in OWASP projects such as Dependency-Track, to patching the vulnerability and tracking its mitigation.
    </p>
    <p>
    Along the way, we'll talk about the efforts that are underway in the industry to improve the vulnerability catalogues or 
    create alternatives to the MITRE CVE.
  bio: |-
    is a US Air Force veteran, US Air Force Academy Graduate, and has had a strange career path: Programmer, 
    biochemist, propellant/nerve agent/coatings chemist, embedded/software/security engineer. He has taught IT and 
    InfoSec courses for both universities and community groups, led the DC505 Defcon community group, and has started 
    three companies in his past. He is also a member of Veterans For Peace. His previous roles in NZ are 
    Security Architect for Plexure and Head of Security for Propellerhead. 
    He is now the CEO and Principal Software Engineer of VioletBeacon.

