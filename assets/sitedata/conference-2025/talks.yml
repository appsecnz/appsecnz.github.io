- plenary: false
  selected: true
  confirmed: true
  remote: false
  day: 0
  block: 10
  track: 0
  title: Supply Chain Vulnerabilities in the Supply Chain Vulnerability Ecosystem
  name: Kris Hardy
  org: VioletBeacon
  anchor: hardy-ecosystem
  abstract: |-
    In March 2025, the Common Vulnerabilities and Exposures (CVE) project was nearly defunded by the US 
    Government, causing panic in the security industry. We will discuss the CVE project, how it fits into 
    the security ecosystem, and what is being done to build alternatives.
  description: |-
    In March 2025, the MITRE Corporation-managed Common Vulnerabilities and Exposures (CVE) project was nearly 
    defunded by the US Government, causing widespread concern across the security industry. They were literally 
    saved in the last hours by a short-term 11-month contract, and surprisingly, this was not the first time. 
    However, with the US Government's current slash-and-burn approach to government programs, the survival of 
    the CVE project is not guaranteed when their current funding runs out.
    </p>
    <p>
    Why did this cause so much concern? When software is built, it nearly always includes a large number of 
    third-party and open source components that provide some functionality so that the developers of the software 
    can focus on the core problems that they need to solve. Unfortunately, these components may have vulnerabilities 
    that make your software vulnerable to attack, have licenses which create legal risks for your organisation, rely 
    on external services that are unexpected or undesired, or be of questionable provenance. To solve this, many 
    organisations now use a Software Bill of Materials (SBOM) and Source Composition Analysis (SCA) (such as OWASP 
    dependency-check) as part of their Cyber Supply Chain Risk Management (C-SCRM) process.
    </p>
    <p>
    The CVE project provides one of the core datasets that is used to check for known vulnerabilities in the software 
    BOM and is consumed by SCA systems. Even if it is not being used directly, it is used by downstream vendors such 
    as the US National Institute of Standards and Technology (NIST) National Vulnerability Database (NVD) and commercial 
    SCA systems. Because it is such a core technology, many fear that the software supply chain vulnerability ecosystem 
    would collapse if the CVE project goes dark.
    </p>
    <p>
    But the CVE project is not without its weaknesses and controversies, some of which are due to the design of the 
    CVE project and others are due to questionable actions by some contributors. To explain the software supply chain 
    ecosystem, the role of the CVE project, downstream consumers of the CVE dataset, and ultimately the potential impact 
    on an organisation, this talk will take a real-world vulnerability and follow it through the vulnerability resolution 
    process from start to finish in order to explain the full ecosystem and what would happen if one part of that 
    ecosystem fails: from discovery and notifying the vendor, to getting it into the CVE catalog and consumed by downstream 
    vendors, to its inclusion in OWASP projects such as Dependency-Track, to patching the vulnerability and tracking its mitigation.
    </p>
    <p>
    Along the way, we'll talk about the efforts that are underway in the industry to improve the vulnerability catalogues or 
    create alternatives to the MITRE CVE.
  bio: |-
    is a US Air Force veteran, US Air Force Academy Graduate, and has had a strange career path: Programmer, 
    biochemist, propellant/nerve agent/coatings chemist, embedded/software/security engineer. He has taught IT and 
    InfoSec courses for both universities and community groups, led the DC505 Defcon community group, and has started 
    three companies in his past. He is also a member of Veterans For Peace. His previous roles in NZ are 
    Security Architect for Plexure and Head of Security for Propellerhead. 
    He is now the CEO and Principal Software Engineer of VioletBeacon.

