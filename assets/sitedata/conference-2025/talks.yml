  title: 'Same-Origin Policy: The core of web security'
  name: Kirk Jackson
  org: Lightspeed
  anchor: jackson-origin
  abstract: |-
    The "same-origin policy"" is a loosely defined set of rules that has evolved over the years since Javascript 
    was first introduced in 1995. In this talk, Kirk will explain how origins work in your web browser, and why 
    they are the fundamental protection against attacks like cross-site request forgery.
  description: |-
    The "same-origin policy"" is a loosely defined set of rules that has evolved over the years since Javascript 
    was first introduced in 1995. 
    </p>
    <p>
    In this talk, Kirk will explain how origins work in your web browser, and why 
    they are the fundamental protection against attacks like cross-site request forgery.
    </p>
    <p>
    Along the way, we'll look at how you can leverage the same-origin policy to protect data on your site, and 
    how you can bend it to your will to allow functionality to be hosted on multiple URLs – such as cross-origin 
    resource sharing (CORS), PostMessage, and JSONP.
  bio: |-
    works at Lightspeed, and has previously been involved in helping organise the OWASP Wellington Meetup and the
    annual OWASP New Zealand Day conference in Auckland.
    </p>
    <p>
    Kirk worked as a web developer before switching to the defence team - setting up Xero's security practice, 
    working as a pen tester, and in defence roles at several companies.

