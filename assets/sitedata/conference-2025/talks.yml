- plenary: false
  selected: true
  confirmed: true
  remote: false
  day: 0
  block: 11
  track: 0
  title: Securing Your Next Application through Security Architecture
  name: Htaik Htaik Thone
  org: Natixis Corporate &amp; Investment Banking
  anchor: thone-architecture
  abstract: |-
    Secure architecture is the backbone. It's not just a feature, it's a philosophy. Build resilient apps 
    intentionally, like skyscrapers against storms. Secure from inception, create unbreakable digital steel. 
    Enforce architectural security: build resilient apps by design, delivering secure deployment.
  description: |-
    In today's fast-paced development landscape, bolting security on as an afterthought is a recipe for disaster. 
    This session champions a proactive approach: Security by Design. Discover how integrating security architecture 
    from the ground up saves time, reduces costs, and creates more maintainable applications.
    </p>
    <p>
    We'll explore the core principles of Security by Design, moving beyond reactive vulnerability patching to build 
    inherently secure systems. Learn how proactive threat modeling identifies risks early, allowing you to design 
    robust defenses from the start. We'll delve into the power of least privilege access, defense in depth, 
    secure defaults, and fail-safe design, illustrating how these principles translate into concrete architectural decisions.
    </p>
    <p>
    This session emphasizes the Secure Development Lifecycle, demonstrating how security architecture becomes an integral 
    part of every stage, from requirements analysis to continuous testing. We'll showcase universal secure architecture and 
    design patterns and explore how concepts like microservices security and Zero Trust architecture enhance resilience. 
    But, secure architecture is more than just a set of patterns; it's a strategic imperative. By intentionally designing 
    security into the application from the outset, we create systems that are not only more secure but also more agile 
    and adaptable to evolving threats.
    </p>
    <p>
    Walk away with a renewed appreciation for the strategic importance of security architecture and actionable insights to 
    build more secure, efficient, and maintainable applications. This is not just about compliance; it's about building a 
    competitive advantage through robust, secure software. Embrace security architecture as the cornerstone of resilient 
    application development. Doing so will not only mitigate risks but also drive innovation, build customer trust, 
    and ensure long-term success in an increasingly complex cyber landscape.
  bio: |-
    is a security professional with experience architecting and implementing robust network and cybersecurity solutions, 
    with a focus on Security by Design. As a network security expert, she designs and implements region-wide enterprise security 
    solutions, integrating advanced technologies and embedding security by design into all projects, leading to reduction in 
    security incidents and increased operational efficiency.
    </p>
    <p>
    Throughout her career, Htaik has successfully led firewall migrations, designed secure architectures, and ensured 
    compliance with key standards such as CIS, NIST, and ISO 27001. She has hands-on experience with various security technologies 
    and leads teams to improve security infrastructure. Driven by a passion for knowledge sharing, she empowers developers to 
    build secure applications by embracing Security by Design principles and fostering a collaborative, security-first culture. 

- plenary: false
  selected: true
  confirmed: true
  remote: true
  day: 0
  block: 11
  track: 1
  title: Security CI/CD Runners through eBPF
  name: Mert Coskuner
  anchor: coskuner-runners
  abstract: |-
    In this presentation, we will share some of our observation through showing different flavours of attack on 
    possible development pipelines, and introduce a tool to detect them.
  description: |-
    CI/CD pipelines are complex environments. This complexity requires methodical comprehensive reviews to secure the 
    entire stack. Often a company may lack the time, specialist security knowledge, and people needed to secure their 
    CI/CD pipelines. Realising these facts, cyberattacks targeting CI/CD pipelines have been gaining momentum, and 
    attackers increasingly understand that build pipelines are highly-privileged targets with a substantial attack 
    surface. In this presentation, we will share some of our observation through showing different flavours of attack 
    on possible development pipelines, and introduce a tool to detect them.
  bio: |-
    is an experienced security engineer who has worked for numerous well-known tech companies. He is a veteran pentester, 
    red teamer, security researcher and malware &amp; cryptography nerd.

