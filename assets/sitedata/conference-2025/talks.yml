  remote: false
  day: 0
  block: 5
  track: 0
  title: 'Good Vibes Only: A security guide to AI programming'
  name: Oliver Szimmetat
  org: TAXbit
  anchor: szimmetat-vibes
  abstract: |-
    AI programming boosts speed but creates security risks — SQL injections, weak auth, XSS vulnerabilities. 
    Learn prompt engineering techniques to get secure AI code and safely integrate it into CI/CD pipelines 
    without sacrificing development velocity.
  description: |-
    AI-assisted "vibe programming" accelerates development, but introduces critical security risks. 
    AI models prioritize working code over secure code, often generating SQL injection vulnerabilities, 
    weak authentication, and XSS attack vectors. This talk demonstrates real-world security failures in 
    AI-generated code and teaches practical prompt engineering techniques to guide models toward secure 
    patterns. Through live examples, we'll cover embedding security requirements in prompts, reviewing 
    AI code for vulnerabilities, and safely integrating AI-generated code into CI/CD pipelines while 
    maintaining development velocity.
  bio: |-
    is the Chief Privacy Office and Director of Security at TAXbit, where he manages 
    all aspects of security and compliance, including Incident Management, Corporate Security, Cloud Security, 
    Security Guidance, Product Security, Physical Security, and Compliance audits. Before joining TAXbit in 
    2023, he was Head of Cloud Security at Uber Engineering in Seattle. There, he built a team working on 
    secure-by-default architecture, best practices, engineering standards, automated compliance, monitoring tools, 
    data security, and threat detection/response solutions for all of Uber’s cloud assets and engineering efforts.
    </p>
    <p>
    Prior to that, Oliver spent more than 18 years at Microsoft, where he worked in various engineering and 
    engineering management roles contributing to Windows client security (developing, testing, and releasing 
    security updates), anti-piracy, cloud security standards, security testing, and continuous 
    integration/delivery for all the company's commercial online services.

- plenary: false
  selected: true
  confirmed: true
  remote: false
  day: 0
  block: 5
  track: 1
  title: Credential Management API
  name: Matt (TC) Cotterell
  org: CyberCX
  anchor: cotterell-api
  abstract: |-
    This talk introduces the Credential Management API, a (largely Google-driven) new standard that 
    allows the browser itself to prompt the user for login credentials, rather than having to code up 
    a web UI to do so. This is still new and largely experimental, but it is interesting to explore!
  description: |-
    The <strong>Credential Management API</strong> is an up-and-coming new browser API, a tentative 
    first step toward an interesting future where the browser handles logging in to a web application 
    instead of the web page itself! No more having to write web UI for your login pages; using this standard, 
    it could mean your browser would be able to handle it all for you! This even includes support for 
    two-factor codes (via SMS), social/federated logins and hardware tokens!
    </p>
    <p>
    We'll go through the four key areas supported by the Credential Management API (Passwords, OTP, Federated 
    Logins, and Passkeys), as well as looking at some demos of the new functionality in action. We'll also 
    explore some of the limitations of this new API at the moment.
  bio: |-
    is a Security Consultant and ex-Software Developer with over 12 years' 
    professional experience in software and security engineering many different organisations. Their 
    focus these days is exploring various authentication patterns and practices, software frameworks and 
    public cloud providers in order to craft beautiful, secure and maintainable solutions to challenging 
    technical problems.
    </p>
    <p>
    They are currently working for CyberCX as a Senior Security Consultant, testing web applications, 
    APIs and cloud configurations for security vulnerabilities. They are also starting to host the 
    <a href="https://www.meetup.com/owasp-wellington" target="_blank"><strong>OWASP Wellington</strong> Meetups</a> 
    on a more frequent basis.

- plenary: false
  selected: true
  confirmed: true
  remote: false
  day: 0
  block: 7
  track: 0
  title: "Baking Security In: An AppSec 'Critical Path' for developers"
  name: John DiLeo
  org: Gallagher Security / OWASP NZ
  anchor: dileo-baking
  description: |-
    "We're Agile, so there's no time for that!" -- This response, or something similar, is what I frequently 
    hear after telling a development team they should include threat modelling, security testing, or other 
    application security (AppSec) activities in their workflows. AppSec activities are frequently seen as 
    heavyweight tasks that will interfere with delivery, instead of the quality and efficiency multipliers 
    they can actually be.
    </p>
    <p>
    In this talk, I'll present my thoughts on key Software Assurance activities teams can introduce into 
    their day-to-day development practices - activities that align amazingly well with the recommended 
    Security Practices in the 
    <a href="https://owaspsamm.org" target="_blank">OWASP Software Assurance Maturity Model (SAMM)</a>. 
    I'll also touch on how they can be incorporated into a team's existing development cadence with 
    (relatively) little disruption.
  bio: |-
    leads the OWASP New Zealand Chapter. In his day job, John is the Application Security Lead at Gallagher 
    Security in Hamilton. Before joining Gallagher, John led the Application Security Services team at Datacom, 
    providing support and guidance to clients in launching, managing, and maturing their enterprise software 
    assurance programs.
    </p>
    <p>
    Before turning to full-time roles in security, John was active as a Java enterprise architect and Web 
    application developer. In earlier lives, John has been a full-time professor and had specialized in 
    developing discrete-event simulations of large distributed systems.

- plenary: false
  selected: true
  confirmed: true
  remote: true
  day: 0
  block: 7
  track: 1
  title: "Security and Accessibility Can Be Friends!"
  name: Gian Wild
  org: AccessibilityOz
  anchor: wild-friends
  abstract: |-
    Many a security expert has been told that security may be compromised due to accessibility needs. 
    Many an accessibility expert has been told accessibility must be reduced to allow for security. 
    Gian Wild is here to tell you that they are wrong.
  description: |-
   Many a security expert has been told that security may be compromised due to accessibility needs. 
   Many an accessibility expert has been told accessibility must be reduced to allow for security. 
   Gian Wild is here to tell you that they are wrong. People often think these two very important 
   disciplines are mutually-exclusive but this is only because they don’t understand both sets of requirements. 
   From the not-so-humble CAPTCHA to the auto completion of forms, Gian talks about what the accessibility 
   needs are and how security need never be compromised, and most importantly, how you can understand 
   both sides of the divide.
  bio: |-
    works in the area of web accessibility: making sure websites and mobile apps can be used by people 
    with disabilities. She spent six years contributing to the international set of web accessibility guidelines 
    used around the world. Gian spends half the year in Australia and half the year in the United States. She 
    speaks at conferences in Australia, the US, Canada, South America and Europe. In June 2015, Gian presented 
    to the United Nations on the importance of web accessibility at the Conference of State Parties to the 
    Convention on the Rights of Persons with Disabilities. She is the CEO and Founder of AccessibilityOz, 
    with offices in Australia and the United States. In 2019, Gian won the inaugural Accessibility 
    Person of the Year in Australia.

- plenary: false
  selected: true
  confirmed: true
  remote: false
  day: 0
  block: 8
  track: 0
  title: 'How to Secure a Cup of Black Gold (coffee, not oil)'
  name: David (Moss) Jennings
  org: Fluid Security
  anchor: jennings-coffee
  abstract: |-
    Let me take you on a journey to explain, in simple terms, the concept of adding multiple security controls 
    to secure a system with data residing on-prem or in the cloud, by using the analogy of a cup with coffee 
    in it. After all, who doesn't want to protect their coffee?
  description: |-
    "You like coffee, right? Well, have you ever thought about how you would secure your cup of coffee against 
    a would-be adversary?" This was the moment when the conversation I was having with a business person took a turn. 
    Their initial expression of "who is this madman?"" soon changed - the more they role-played, the more they understood.
    </p>
    <p>
    Incorporating a defence-in-depth strategy can be hard to understand for non-security folk. However, when you 
    use analogies of everyday important things like coffee, it's amazing how quickly people can understand what 
    adding multiple layers of security controls means and how they can apply it to suit their context to a 'tea.'
    </p>
    <p>
    Optional: bring a cup of your own beverage to follow along.
  bio: |-
    remains optimistic that he can make organisations great again (read: more secure). However, he has seen his 
    fair share of horror stories over his career. With risks being blindly accepted and added to ever expanding 
    registers, it wasn’t long before he was in the ambulance at the bottom of the cliff. Let his dulcet tones 
    soothe you as you come for a ride and learn how to be useful instead of just making nee-naw sounds when the 
    worst occurs.

