- active: true
  level: 5
  name: SecDim
  anchor: secdim
  image: /assets/images/2025-sponsors/Logo-SecDim.png
  url: https://secdim.com/
  description: |-
    For many years, we did lots of penetration testing across medium-size startups to Fortune 500 enterprises. We realised 
    often that our pentest reports do not solve these firms'' security problems. In fact their biggest security problem was 
    not related to the design nor implementation of their programs. The root cause was something else.
    </p>
    <p>
    A wrong culture and approach to security that did not encourage their engineering teams to actively look into eliminating 
    security bugs. Instead they saw the security bug reports as an additional burden to deal with.

