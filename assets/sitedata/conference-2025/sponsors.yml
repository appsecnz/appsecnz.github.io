- active: true
  level: 2
  name: Bastion Security Group
  anchor: bastion
  image: /assets/images/2025-sponsors/Logo-Bastion_Security_Group.png
  url: https://bastionsecurity.co.nz/
  spotlight: |-
    Bastion Security Group is a leading cybersecurity consultancy in New Zealand, formed by the strategic amalgamation of 
    Quantum Security, ZX Security, Helix Security, and Cassini, creating a powerhouse with comprehensive expertise in cybersecurity 
    services. This union has positioned Bastion as a leading player in the New Zealand market, serving around 200 enterprise and 
    government customers with a team of over 130 professionals. The company offers a wide range of cybersecurity consulting services, 
    designed to address the most pressing cybersecurity challenges, enhancing organizations' defences against evolving cyber threats.
  description: |-
    Bastion Security Group is a leading cybersecurity consultancy in New Zealand, formed by the strategic amalgamation of 
    Quantum Security, ZX Security, Helix Security, and Cassini, creating a powerhouse with comprehensive expertise in cybersecurity 
    services. This union has positioned Bastion as a leading player in the New Zealand market, serving around 200 enterprise and 
    government customers with a team of over 130 professionals. The company offers a wide range of cybersecurity consulting services, 
    including penetration testing, governance, risk and compliance consulting, digital forensics and incident response (DFIR), design, 
    build and architecture, cyber threat intelligence, cloud security, and training. These services are designed to address the most 
    pressing cybersecurity challenges, enhancing organizations' defences against evolving cyber threats.
    </p>
    <p>
    As a sponsor of the OWASP Day in Auckland, Bastion Security Group demonstrates its commitment to promoting cybersecurity awareness 
    and education within the community. The company's active engagement in such events reflects its dedication to fostering a safer 
    digital environment in New Zealand and beyond.
    </p>
    <p>
    By leveraging the expertise and capabilities of its combined entities, Bastion Security Group is well-equipped to address 
    complex cybersecurity challenges, offering clients cutting-edge solutions tailored to their specific needs. The company's focus on 
    innovation, client outcomes, and the expansion of its service portfolio signifies its ambition to lead in the cybersecurity consulting 
    space, making it a valuable partner for organizations looking to enhance their cybersecurity posture​.
    
- active: true
  level: 2
  name: Secure Code Warrior
  image: /assets/images/2025-sponsors/Logo-Secure_Code_Warrior.png
  url: https://securecodewarrior.com/
  spotlight: |-
    Secure Code Warrior was co-founded by Pieter Danhieux and Matias Madou Ph.D., two globally recognised security experts. Through 
    their combined security experience as developers, researchers, trainers and consultants, Pieter and Matias had experienced the 
    negative impact of insecure code and were frustrated by the industry's focus on simply finding vulnerabilities, rather than fixing 
    or preventing them in the first place.  
  description: |-
    Secure Code Warrior was co-founded by Pieter Danhieux and Matias Madou Ph.D., two globally recognised security experts. Through 
    their combined security experience as developers, researchers, trainers and consultants, Pieter and Matias had experienced the 
    negative impact of insecure code and were frustrated by the industry's focus on simply finding vulnerabilities, rather than fixing 
    or preventing them in the first place.
    </p>
    <p>
    Both recognised that improving secure coding skills and outcomes would add a powerful 
    layer of cyber protection for companies and would help them make better code, faster. Developers didn’t need to become security 
    experts <em>per se</em>, but they could be empowered positively to be the first line of defence for their organisation.
    </p>
    <p>
    The team pioneered an innovative approach to improving secure coding skills and outcomes that is simple, scalable and positive; 
    and works for both Development and Application or Information Security groups. The team is driven by the knowledge that measurable 
    improvements in security compliance, consistency and predictability will be matched by a better quality and speed of code writing. 
    And that creates an environment in which everyone can enjoy spending more time building, and less time fixing!

