  name: SecDim
  anchor: secdim-attack-defence
  title: 'SecDim Attack &amp; Defence Challenge'
  description: |-
     A hands-on session, where teams go head-to-head in an AppSec wargame. You'll take on real-world vulnerabilities, 
     switch between attacker and defender roles, and learn from each other in real time. No fluff—just code, exploits, 
     and practical learning.
    
