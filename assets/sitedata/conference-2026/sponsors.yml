  name: 2 Degrees
  anchor: 2degrees
  image: /assets/images/2026-sponsors/2degrees-Logo-White-RGB.jpg
  url: https://www.2degrees.nz/
  spotlight: |-
    In 2022 New Zealand's leading challenger telecommunications companies – 2degrees and Vocus – came together under the 
    2degrees brand to form New Zealand's third largest, full-service telecommunications provider. 2degrees offers 
    broadband and mobile services covering 98.5% of places Kiwis live and work, a nationwide fibre network and modern 
    technology platforms, as well as energy services – all supported by an award-winning customer care team and a 
    network of 58 retail stores. It operates the 2degrees, Slingshot, and Orcon brands.
