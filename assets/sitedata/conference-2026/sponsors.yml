# Definitions for this file
# active: true if the company is an active sponsor, false otherwise - Set to false, to preload info before agreement signed
# level: 1 = Diamond, 2 = Platinum, 3 = Gold, 4 = Silver, 5 = Bronze, 6 = Supporting, for others enter exact description, including 'Sponsor'
# name: name of company
# image: relative URL to the logo image
# url: url of the company website
# description: description of the company
- active: true
  level: 1
  name: RedShield
  anchor: redshield
  image: /assets/images/2026-sponsors/RedShield_logo.svg
  url: https://redshield.co/
  spotlight: |-
    RedShield is a managed security service for web applications that delivers rapid risk reduction without
    code changes. Combining expert people, proven processes, advanced security tooling, and an AWS-powered service platform, RedShield 
    provides continuous monitoring, continuous auditing of all your controls, managed WAF protection, bot and DDoS defence, 
    and 24/7 security operations support to protect critical applications at scale.
  description: |-
    <b>RedShield is a managed security service for web applications that delivers rapid risk reduction without
    code changes.</b>
    </p>
    <p>
    Security teams already know where many vulnerabilities exist. The challenge is remediating them quickly enough. 
    RedShield bridges this gap by identifying exploitable paths and deploying tailored mitigations that neutralise 
    vulnerabilities at the traffic layer, often within days.
    </p>
    <p>
    By addressing application-specific risks, including access control weaknesses, input handling flaws, and business 
    logic vulnerabilities, RedShield helps organisations reduce exposure while development teams work through long-term 
    remediation plans.
    </p>
    <p>
    Combining expert people, proven processes, advanced security tooling, and an AWS-powered service platform, RedShield 
    provides continuous monitoring, continuous auditing of all your controls, managed WAF protection, bot and DDoS defence, 
    and 24/7 security operations support to protect critical applications at scale.
    
- active: true
