# Definitions for this file
# active: true, if the information contained in this file should be used to render 
#         a Demo/Breakout entry in the schedule; false, if the block should be left blank
# day: 0 - Thursday; 1 - Friday
# block: Block number of the speaker's time slot - First speaking slot each day is Block 3
# name: Host/Sponsor name
# title: Full title of talk
# org: Host's organisation - for Breakout meetings
# video: URL of video, once uploaded to YouTube
# length: Runtime of YouTube video
# slides: full path to presentation slide deck, if in local assets; full URL, if not
# format: File format for slide deck
# size: File size of slide deck
# description: full-length description of the talk
#
# IMPORTANT: schedule.html indexes this data by ARRAY POSITION within each day, not
# by matching the 'block' field. There MUST be exactly one entry per block number,
# in sequential order with no gaps, matching schedule.yml's block numbering for that
# day - even for plenary/break blocks where a breakout slot doesn't apply. Do not
# delete or skip a block entry, or every later block that day will be misaligned.
#
# TODO: Two known 2026 breakout sessions (Juice Shop MultiJuicer CTF, Secure Vibe
# Coding with AI - see breakouts.md) still need their block/day slots confirmed and
# set to active: true below, with anchor/title/org/description filled in to match.

